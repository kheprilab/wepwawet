name: Bug report
description: Report a problem with Wepwawet.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Issues are reviewed weekly.
        For security vulnerabilities, use [private reporting](https://github.com/kheprilab/wepwawet/blob/main/SECURITY.md) instead of a public issue.
  - type: input
    id: wepwawet-version
    attributes:
      label: Wepwawet version
      description: Run `wep --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the OS name and version.
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`.
    validations:
      required: true
  - type: dropdown
    id: coding-agent
    attributes:
      label: Coding agent involved
      description: If Other, name it in the reproduction steps.
      options:
        - Claude Code
        - Codex
        - Copilot
        - Pi
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the commands and setup needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include any output that helps explain the problem.
      render: text
